# pochi 設定ファイル
#
#   ~/.config/pochi/config.conf に置いてください。
#
# 書式
#   [.txt .md]        セクション。拡張子はドット付き、スペース区切りで複数可
#   [folder]          フォルダを開いたとき
#   [*]               どのセクションにも該当しないとき（ぽちエスの '.*'）
#   [all]             すべてのメニューの末尾に追加（ぽちエスの 'all'）
#
#   v | Vim | vim %P  「キー | 表示名 | コマンド」
#   -                 セパレータ
#   { エディタ         サブメニュー開始
#   }                 サブメニュー終了
#
# マクロ（自動でシェルクォートされます。"%P" のように囲む必要はありません）
#   %P  フルパス
#   %D  親フォルダのパス
#   %N  ファイル名（拡張子つき）
#   %F  親フォルダ名
#   %E  拡張子
#   %A  ファイル名（拡張子なし）
#   %B  フルパス（拡張子なし）
#   %M  選択された全ファイル（スペース区切り、各々クォート済み）
#   %X  実行時に入力ダイアログを出す（%X"初期値" で初期値つき）
#   %%  % そのもの
#
# コマンドは /bin/sh -c で実行され、カレントディレクトリは %D になります。


# ─────────────────────────────────────────────
# テキスト系
# ─────────────────────────────────────────────
[.txt .json .yaml .yml .conf .ini .log .csv]
v | Vim (iTerm)        | open-in-iterm vim %P
c | VS Code            | open -a "Visual Studio Code" %P
l | less で見る         | open-in-iterm less %P
-
d | デフォルトアプリ     | open %P


# ─────────────────────────────────────────────
# Markdown
# ─────────────────────────────────────────────
[.md .markdown]
z | Zed                | open -a Zed %P
m | MD Viewer          | open -a "MD Viewer" %P
v | Vim (iTerm)        | open-in-iterm vim %P
c | VS Code            | open -a "Visual Studio Code" %P
l | less で見る         | open-in-iterm less %P
-
d | デフォルトアプリ     | open %P


# ─────────────────────────────────────────────
# HTML
# ─────────────────────────────────────────────
[.html .htm]
v | Vivaldi            | open -a Vivaldi %P
g | Google Chrome      | open -a "Google Chrome" %P
c | VS Code            | open -a "Visual Studio Code" %P
e | Vim (iTerm)        | open-in-iterm vim %P
-
d | デフォルトアプリ     | open %P


# ─────────────────────────────────────────────
# ソースコード
# ─────────────────────────────────────────────
[.swift .py .rb .js .ts .go .rs .c .h .cpp .sh .lua]
v | Vim (iTerm)        | open-in-iterm vim %P
c | VS Code            | open -a "Visual Studio Code" %P
-
{ 実行する
  r | そのまま実行       | open-in-iterm %P
  a | 引数をつけて実行    | open-in-iterm %P %X""
}
-
d | デフォルトアプリ     | open %P


# ─────────────────────────────────────────────
# 画像
# ─────────────────────────────────────────────
[.png .jpg .jpeg .gif .webp .heic .tiff .bmp]
p | プレビュー          | open -a Preview %P
q | Quick Look         | qlmanage -p %P
c | クリップボードへコピー | pochi-copy-image %P
-
d | デフォルトアプリ     | open %P


# ─────────────────────────────────────────────
# PDF
# ─────────────────────────────────────────────
[.pdf]
p | プレビュー          | open -a Preview %P
q | Quick Look         | qlmanage -p %P
d | デフォルトアプリ     | open %P


# ─────────────────────────────────────────────
# フォルダ
# ─────────────────────────────────────────────
[folder]
i | iTerm で開く        | open -a iTerm %P
f | Finder で開く       | open %P
v | Vim で開く          | open-in-iterm vim %P


# ─────────────────────────────────────────────
# 上のどれにも当てはまらない拡張子
# ─────────────────────────────────────────────
[*]
d | デフォルトアプリで開く | open %P
v | Vim (iTerm)        | open-in-iterm vim %P
a | アプリを選んで開く    | pochi-choose-app %P


# ─────────────────────────────────────────────
# 全メニュー共通（末尾に付きます）
# ─────────────────────────────────────────────
[all]
-
r | Finder で表示       | open -R %P
n | パスをコピー         | printf %%s %P | pbcopy
